name: CI

on:
  push:
  pull_request:

jobs:
  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      - name: Check flake
        run: nix flake check --print-build-logs

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Prepare isolated HOME
        run: |
          HOME_DIR="$RUNNER_TEMP/agent-badge-home"
          mkdir -p "$HOME_DIR"
          echo "HOME=$HOME_DIR" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test -- --run

  scenario-matrix:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Prepare isolated HOME
        run: |
          HOME_DIR="$RUNNER_TEMP/agent-badge-home"
          mkdir -p "$HOME_DIR"
          echo "HOME=$HOME_DIR" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run release-readiness scenario matrix
        run: npm test -- --run packages/agent-badge/src/commands/release-readiness-matrix.test.ts

  release-readiness:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - name: Prepare isolated HOME
        run: |
          HOME_DIR="$RUNNER_TEMP/agent-badge-home"
          mkdir -p "$HOME_DIR"
          echo "HOME=$HOME_DIR" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Verify docs
        run: npm run docs:check
      - name: Verify clean checkout release path
        run: npm run verify:clean-checkout
